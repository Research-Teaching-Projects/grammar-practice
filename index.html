<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grammar practice</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111;background:#fff;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px}
nav{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:18px;flex-wrap:wrap}
nav a{color:#111}
h1{font-size:26px;margin:0 0 6px}
.sub{color:#555;margin:0 0 18px}
.rules{border:1px solid #111;border-radius:8px;padding:14px 18px;margin-bottom:20px}
.rules h2{font-size:15px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.rules ul{margin:0;padding-left:20px}
.rules li{margin:4px 0}
.bar{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:10px 0;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;z-index:2}
.score{font-weight:700}
.prog{flex:1;min-width:120px;height:8px;background:#eee;border-radius:4px;overflow:hidden}
.prog span{display:block;height:100%;width:0;background:#111;transition:width .2s}
button{font:inherit;cursor:pointer;border:1px solid #111;background:#fff;color:#111;border-radius:6px;padding:6px 14px}
button:hover{background:#f2f2f2}
button.primary{background:#111;color:#fff}
button.primary:hover{background:#333}
button:disabled{cursor:default;opacity:.55}
.opts button:disabled{opacity:1}
.q{border:1px solid #ccc;border-radius:8px;padding:14px 16px;margin-bottom:12px}
.q.ok{border-color:#0a8a3a;background:#f2fbf5}
.q.bad{border-color:#c00000;background:#fff5f5}
.num{font-size:13px;color:#666;margin-bottom:4px}
.text{font-size:17px}
.text input{font:inherit;font-size:17px;border:none;border-bottom:2px solid #111;width:9.5em;padding:1px 4px;background:transparent;text-align:center}
.text input:focus{outline:none;border-bottom-color:#555;background:#f7f7f7}
.row{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.row:empty,.opts+.row:not(:has(.again)){display:none}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opts button{text-align:left;font-size:16px}
.opts button.right{border-color:#0a8a3a;background:#e3f6ea;color:#0a6a2c;font-weight:600}
.opts button.wrong{border-color:#c00000;background:#fde8e8;color:#a00000;text-decoration:line-through}
.fb{margin-top:10px;font-size:15px}
.fb .y{color:#0a7a33;font-weight:700}
.fb .n{color:#c00000;font-weight:700}
.fb .ans{color:#0a7a33;font-weight:700}
button.again{display:none}
.q.fin button.again{display:inline-block}
.done{border:2px solid #111;border-radius:8px;padding:16px;margin-top:20px;display:none;text-align:center;font-size:18px}
footer{margin-top:28px;font-size:13px;color:#666}

.menu{list-style:none;padding:0;margin:0} .menu li{margin:8px 0}
.menu a{display:block;border:1px solid #ccc;border-radius:8px;padding:12px 14px;color:#111;text-decoration:none;font-size:17px}
.menu a:hover{border-color:#111} .cnt{color:#666;font-size:14px}
</style></head>

<script>const TOPICS=[{"title": "Subject and verb agreement", "intro": "Type the correct form of the verb in brackets.", "rules": ["Plural subjects take a verb with no -s: <b>they work<\/b>, <b>teachers work<\/b>, <b>all of us want<\/b>.", "He, she, it, or one person/thing takes the -s form: <b>she works<\/b>, <b>he does<\/b>, <b>it has<\/b>.", "After do, does, did, can, will, should and must, use the base verb: <b>does not affect<\/b>.", "Two subjects joined by <b>and<\/b> take a plural verb: <b>hard work and patience are<\/b>.", "In \"robots as teachers\", the subject is <b>robots<\/b>, so the verb is plural."], "q": [{"t": "b", "q": "All of us ___ (want) to pass the exam.", "a": ["want"], "why": "\"All of us\" is plural, so the verb has no -s."}, {"t": "b", "q": "Many of my friends ___ (have) part-time jobs.", "a": ["have"], "why": "\"Many of my friends\" is plural: have, not has."}, {"t": "b", "q": "Teachers ___ (work) very hard during exam season.", "a": ["work"], "why": "\"Teachers\" is plural, so no -s on the verb."}, {"t": "b", "q": "My sister ___ (work) at a hospital.", "a": ["works"], "why": "\"My sister\" is one person (she), so the verb takes -s."}, {"t": "b", "q": "She ___ (do) not like spicy food.", "a": ["does"], "why": "With he, she or it, use does, not do."}, {"t": "b", "q": "He does not ___ (know) the answer.", "a": ["know"], "why": "After does, use the base verb with no -s."}, {"t": "b", "q": "Both my parents ___ (be) doctors.", "a": ["are"], "why": "\"Both my parents\" is plural: are."}, {"t": "b", "q": "Hard work and patience ___ (lead) to success.", "a": ["lead"], "why": "Two subjects joined by \"and\" take a plural verb."}, {"t": "b", "q": "Each student ___ (have) a laptop.", "a": ["has"], "why": "\"Each\" refers to one student at a time, so it is singular: has."}, {"t": "b", "q": "The company ___ (need) more staff.", "a": ["needs"], "why": "\"The company\" is singular (it), so the verb takes -s."}, {"t": "b", "q": "Robots as teachers ___ (be) a new idea.", "a": ["are"], "why": "The subject is \"robots\", which is plural."}, {"t": "b", "q": "Students who practise every day ___ (improve) quickly.", "a": ["improve"], "why": "The subject is \"students\" (plural). \"Who practise every day\" just describes them."}, {"t": "b", "q": "One of my friends ___ (live) in Toronto.", "a": ["lives"], "why": "The subject is \"one\", which is singular. \"Of my friends\" does not change that."}, {"t": "b", "q": "Everybody ___ (want) to be happy.", "a": ["wants"], "why": "Everybody, everyone and somebody are singular: wants."}, {"t": "b", "q": "People feel valued and ___ (work) harder when managers listen.", "a": ["work"], "why": "\"People\" is the subject of both verbs: people feel ... and work."}, {"t": "b", "q": "The leadership ___ (make) the final decision.", "a": ["makes"], "why": "\"The leadership\" is treated as one group (it): makes."}, {"t": "b", "q": "Can she ___ (drive) a car?", "a": ["drive"], "why": "After can, use the base verb."}, {"t": "b", "q": "My brother and I ___ (play) cricket every Sunday.", "a": ["play"], "why": "\"My brother and I\" means \"we\", which is plural."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Most of us have a phone.", "Most of us has a phone."], "why": "\"Most of us\" is plural: have."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Studies need a lot of focus.", "Studies needs a lot of focus."], "why": "\"Studies\" is plural, so the verb has no -s."}]}, {"title": "\"A\" or \"an\"", "intro": "Type a or an. If no article is needed, type none.", "rules": ["Use <b>an<\/b> before a vowel <i>sound<\/i>: an example, an hour, an MBA.", "Use <b>a<\/b> before a consonant <i>sound<\/i>, even if the letter is a vowel: a university, a European, a one-way street.", "Never use a or an in front of a plural noun: <b>arguments<\/b>, not a arguments."], "q": [{"t": "b", "q": "It was ___ honest mistake.", "a": ["an"], "why": "The h in honest is silent, so the word starts with a vowel sound."}, {"t": "b", "q": "She is ___ university student.", "a": ["a"], "why": "University starts with a \"you\" sound, which is a consonant sound."}, {"t": "b", "q": "He gave ___ example.", "a": ["an"], "why": "Example starts with a vowel sound."}, {"t": "b", "q": "We need ___ umbrella.", "a": ["an"], "why": "Umbrella starts with a vowel sound."}, {"t": "b", "q": "This is ___ one-way street.", "a": ["a"], "why": "One starts with a \"w\" sound, which is a consonant sound."}, {"t": "b", "q": "She works as ___ engineer.", "a": ["an"], "why": "Engineer starts with a vowel sound."}, {"t": "b", "q": "He has ___ European passport.", "a": ["a"], "why": "European starts with a \"you\" sound."}, {"t": "b", "q": "It takes ___ hour to get there.", "a": ["an"], "why": "The h in hour is silent."}, {"t": "b", "q": "I bought ___ expensive watch.", "a": ["an"], "why": "Expensive starts with a vowel sound."}, {"t": "b", "q": "There was ___ argument at the meeting.", "a": ["an"], "why": "Argument starts with a vowel sound."}, {"t": "b", "q": "He made ___ important decision.", "a": ["an"], "why": "Important starts with a vowel sound."}, {"t": "b", "q": "She wants to become ___ teacher.", "a": ["a"], "why": "Teacher starts with a consonant sound."}, {"t": "b", "q": "Television is ___ integral part of life.", "a": ["an"], "why": "Integral starts with a vowel sound."}, {"t": "b", "q": "I have ___ idea.", "a": ["an"], "why": "Idea starts with a vowel sound."}, {"t": "b", "q": "It was ___ useful lesson.", "a": ["a"], "why": "Useful starts with a \"you\" sound."}, {"t": "b", "q": "He is ___ MBA student.", "a": ["an"], "why": "MBA is said \"em-bee-ay\", which starts with a vowel sound."}, {"t": "b", "q": "We need to make ___ informed decision.", "a": ["an"], "why": "Informed starts with a vowel sound."}, {"t": "b", "q": "This policy caused ___ arguments in the team.", "a": ["none", "no article", "-", "no"], "why": "Arguments is plural, so there is no a or an."}]}, {"title": "Using \"the\"", "intro": "Choose the right article for each blank.", "rules": ["Use <b>the<\/b> with decades: <b>the 1950s<\/b>, <b>the early 2000s<\/b>.", "Use <b>the<\/b> in fixed phrases: the human race, the poverty line, the same, on the other hand, the other.", "A singular countable noun needs a, an or the: <b>a lot of<\/b>, <b>a shortage<\/b>, <b>an ideal situation<\/b>.", "Use no article for a general idea: <b>society<\/b>, <b>life<\/b>, <b>music<\/b> (in general)."], "q": [{"t": "c", "q": "Mobile phones became popular in ___ 1990s.", "o": ["the", "a", "an", "no article"], "why": "Decades take \"the\".", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "He was born in ___ early 2000s.", "o": ["the", "a", "an", "no article"], "why": "Periods of time like the early 2000s take \"the\".", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "On ___ other hand, malls are expensive.", "o": ["the", "a", "an", "no article"], "why": "The fixed phrase is \"on the other hand\".", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "Many families live below ___ poverty line.", "o": ["the", "a", "an", "no article"], "why": "There is only one poverty line, so use \"the\".", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "AI affects ___ human race.", "o": ["the", "a", "an", "no article"], "why": "\"The human race\" is a fixed phrase.", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "___ society changes as technology improves.", "o": ["no article", "a", "an", "the"], "why": "Society in general takes no article.", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "The two shops sell ___ same item.", "o": ["the", "a", "an", "no article"], "why": "\"Same\" always takes \"the\".", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "We had ___ lot of rain last week.", "o": ["a", "an", "the", "no article"], "why": "The phrase is \"a lot of\".", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "It is not ___ ideal situation.", "o": ["an", "a", "the", "no article"], "why": "Situation is singular and countable, and ideal starts with a vowel sound.", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "She checks her email on ___ day-to-day basis.", "o": ["a", "an", "the", "no article"], "why": "The phrase is \"on a day-to-day basis\".", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "I love ___ music.", "o": ["no article", "a", "an", "the"], "why": "Music in general takes no article.", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "___ music at the party was too loud.", "o": ["the", "a", "an", "no article"], "why": "This is specific music (at the party), so use \"the\".", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "There is ___ shortage of water.", "o": ["a", "an", "the", "no article"], "why": "Shortage is singular and countable here: a shortage.", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "One shop is open, and ___ other is closed.", "o": ["the", "a", "an", "no article"], "why": "When there are two, the second one is \"the other\".", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "___ life is not always easy.", "o": ["no article", "a", "an", "the"], "why": "Life in general takes no article.", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "___ sun rises in the east.", "o": ["the", "a", "an", "no article"], "why": "There is only one sun.", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "He is ___ best student in the class.", "o": ["the", "a", "an", "no article"], "why": "Superlatives (best, biggest) take \"the\".", "fixed": true, "order": ["a", "an", "the", "no article"]}, {"t": "c", "q": "This is ___ problem we must solve.", "o": ["a", "an", "the", "no article"], "why": "A new, singular, countable problem: a problem.", "fixed": true, "order": ["a", "an", "the", "no article"]}]}, {"title": "Singular and plural nouns", "intro": "Type the correct form of the noun in brackets.", "rules": ["<b>One of the<\/b> is followed by a plural noun: one of the best <b>teachers<\/b>.", "<b>Many, multiple, several, different, various<\/b> are followed by plural nouns.", "Irregular plurals: life → lives, child → children, person → people, woman → women.", "Uncountable nouns have no plural and no a/an: research, advice, information, infrastructure, employment."], "q": [{"t": "b", "q": "She is one of the best ___ (teacher) in the school.", "a": ["teachers"], "why": "\"One of the\" is followed by a plural noun."}, {"t": "b", "q": "I have multiple ___ (task) to finish today.", "a": ["tasks"], "why": "\"Multiple\" means more than one, so the noun is plural."}, {"t": "b", "q": "There are different ___ (class) of people in every city.", "a": ["classes"], "why": "\"Different\" + plural noun. Nouns ending in -ss add -es."}, {"t": "b", "q": "Robots can do repetitive ___ (task) without stopping.", "a": ["tasks"], "why": "Speaking about tasks in general, use the plural."}, {"t": "b", "q": "Smartphones have changed our ___ (life).", "a": ["lives"], "why": "The plural of life is lives."}, {"t": "b", "q": "Many ___ (child) play outside after school.", "a": ["children"], "why": "The plural of child is children."}, {"t": "b", "q": "Several ___ (problem) came up during the project.", "a": ["problems"], "why": "\"Several\" + plural noun."}, {"t": "b", "q": "Workers need regular ___ (break).", "a": ["breaks"], "why": "Breaks happen more than once, so use the plural."}, {"t": "b", "q": "Three ___ (person) attended the meeting.", "a": ["people"], "why": "The usual plural of person is people."}, {"t": "b", "q": "Two ___ (woman) won the award.", "a": ["women"], "why": "The plural of woman is women."}, {"t": "b", "q": "Mumbai is one of the largest ___ (city) in India.", "a": ["cities"], "why": "\"One of the\" + plural. City becomes cities."}, {"t": "b", "q": "Different ___ (country) have different rules.", "a": ["countries"], "why": "Country becomes countries."}, {"t": "b", "q": "She gave me some good ___ (advice).", "a": ["advice"], "why": "Advice is uncountable, so it has no plural."}, {"t": "b", "q": "We need more ___ (information) before we decide.", "a": ["information"], "why": "Information is uncountable."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Research shows that sleep improves memory.", "A research shows that sleep improves memory.", "Researches show that sleep improves memory."], "why": "Research is uncountable. To count it, say \"a study\" or \"studies\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["This infrastructure uses a lot of water.", "These infrastructure uses a lot of water.", "These infrastructures uses a lot of water."], "why": "Infrastructure is uncountable, so use \"this\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["She found a job last month.", "She found an employment last month.", "She found employments last month."], "why": "Employment is uncountable. Use \"a job\" for one position."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["AI is one of the major technological advancements of our time.", "AI is one of the major technological advancement of our time."], "why": "\"One of the\" is always followed by a plural noun."}]}, {"title": "Commonly confused words", "intro": "Choose the right word for each blank.", "rules": ["<b>than<\/b> compares; <b>then<\/b> means next or at that time.", "<b>their<\/b> = belonging to them; <b>there<\/b> = a place or \"there is\"; <b>they're<\/b> = they are.", "<b>its<\/b> = belonging to it; <b>it's<\/b> = it is or it has.", "<b>sometimes<\/b> = now and then; <b>sometime<\/b> = at some unknown time.", "Spelling check: <b>because<\/b>, <b>in any way<\/b>, <b>bane<\/b>."], "q": [{"t": "c", "q": "She is taller ___ her brother.", "o": ["than", "then"], "why": "Comparison, so use than."}, {"t": "c", "q": "We ate dinner, and ___ we watched a film.", "o": ["then", "than"], "why": "Next in time, so use then."}, {"t": "c", "q": "I would rather walk ___ drive.", "o": ["than", "then"], "why": "Comparison between two choices: than."}, {"t": "c", "q": "First mix the flour, ___ add the eggs.", "o": ["then", "than"], "why": "Next step: then."}, {"t": "c", "q": "___ house is near the station.", "o": ["Their", "There", "They're"], "why": "Belonging to them: their."}, {"t": "c", "q": "Put the books over ___.", "o": ["there", "their", "they're"], "why": "A place: there."}, {"t": "c", "q": "___ going to be late.", "o": ["They're", "Their", "There"], "why": "They are going: they're."}, {"t": "c", "q": "___ is a problem with the code.", "o": ["There", "Their", "They're"], "why": "\"There is\": there."}, {"t": "c", "q": "The company changed ___ logo.", "o": ["its", "it's"], "why": "Belonging to the company: its (no apostrophe)."}, {"t": "c", "q": "___ raining again.", "o": ["It's", "Its"], "why": "It is raining: it's."}, {"t": "c", "q": "The dog wagged ___ tail.", "o": ["its", "it's"], "why": "Belonging to the dog: its."}, {"t": "c", "q": "___ been a long day.", "o": ["It's", "Its"], "why": "It has been: it's."}, {"t": "c", "q": "I ___ walk to work when the weather is nice.", "o": ["sometimes", "sometime"], "why": "Now and then: sometimes."}, {"t": "c", "q": "Let's meet ___ next week.", "o": ["sometime", "sometimes"], "why": "At an unknown time: sometime."}, {"t": "c", "q": "___ the trains are late.", "o": ["Sometimes", "Sometime"], "why": "Now and then: sometimes."}, {"t": "c", "q": "This change will not help us in ___ way.", "o": ["any", "anyway"], "why": "\"In any way\" is three separate words."}, {"t": "c", "q": "Social media can be both a boon and a ___.", "o": ["bane", "bain"], "why": "The word is spelled bane."}, {"t": "c", "q": "I was late ___ the bus broke down.", "o": ["because", "becuase", "beacause"], "why": "The spelling is b-e-c-a-u-s-e."}]}, {"title": "Run-on sentences (comma splices)", "intro": "Choose the sentence that is punctuated correctly.", "rules": ["A comma alone cannot join two complete sentences.", "Fix it with a full stop, a semicolon, or a joining word (and, but, so).", "<b>However<\/b>, <b>on the other hand<\/b> and <b>because of this<\/b> cannot join two sentences with just a comma. Start a new sentence or use a semicolon."], "q": [{"t": "c", "q": "Choose the correct sentence.", "o": ["The train was late. I missed my meeting.", "The train was late, I missed my meeting."], "why": "Two complete sentences need a full stop between them."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["I like tea, but my brother likes coffee.", "I like tea, my brother likes coffee."], "why": "Add a joining word (but) after the comma."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The job pays well; however, the hours are long.", "The job pays well, however the hours are long."], "why": "\"However\" needs a semicolon or full stop before it and a comma after it."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["She studied hard, so she passed.", "She studied hard, she passed."], "why": "\"So\" joins the two sentences."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["TV is popular; most homes have one.", "TV is popular, most homes have one."], "why": "A semicolon can join two closely related sentences."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["It rained all day. Because of this, the match was cancelled.", "It rained all day, because of this the match was cancelled."], "why": "\"Because of this\" starts a new sentence."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Malls are expensive. On the other hand, they offer variety.", "Malls are expensive, on the other hand, they offer variety."], "why": "\"On the other hand\" starts a new sentence here."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["He was tired, so he went to bed early.", "He was tired, he went to bed early."], "why": "Join with \"so\" or use a full stop."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The policy helped staff. They felt more responsible.", "The policy helped staff, they felt more responsible."], "why": "Two complete sentences: use a full stop."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["I wanted to go out, but it was raining.", "I wanted to go out, it was raining."], "why": "Use \"but\" to show the contrast."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Prices are rising, and people are buying less.", "Prices are rising, people are buying less."], "why": "Use \"and\" after the comma, or a full stop."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["AI is useful. However, it uses a lot of water.", "AI is useful, however it uses a lot of water."], "why": "Start a new sentence with \"However,\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Robots do not get tired; they can work all day.", "Robots do not get tired, they can work all day."], "why": "Use a semicolon or full stop between two complete sentences."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["My phone died, so I could not call you.", "My phone died, I could not call you."], "why": "Use \"so\" to join cause and result."}]}, {"title": "Verb tense", "intro": "Type the correct form of the verb in brackets.", "rules": ["Finished past events use the simple past: <b>opened<\/b>, <b>got<\/b>, <b>developed<\/b>.", "<b>Since<\/b> + a point in time uses has/have + past participle: <b>has lived since 2019<\/b>.", "In an <b>if<\/b> clause about the future, use the present tense, not will: <b>if it rains<\/b>.", "After will, would and can, use the base verb: <b>there will be<\/b>."], "q": [{"t": "b", "q": "Last year, the company ___ (open) a new office.", "a": ["opened"], "why": "Last year is finished time: simple past."}, {"t": al ending in s), the children<b>'s<\/b> toys.", "<b>Both<\/b> goes before the two nouns it joins. Do not repeat the same idea (solely ... only)."], "q": [{"t": "c", "q": "Choose the correct sentence.", "o": ["He will not be happy.", "He will be not happy."], "why": "\"Not\" goes right after will."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We sometimes have to do two jobs.", "We have sometimes do two jobs."], "why": "Sometimes goes before \"have to\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["People usually watch TV after dinner.", "People watch usually TV after dinner."], "why": "Usually goes before the main verb."}, {"t": "b", "q": "The story kept the children ___ (entertain).", "a": ["entertained"], "why": "Keep someone + past participle: entertained."}, {"t": "b", "q": "Technology is getting more ___ (advance).", "a": ["advanced"], "why": "Get + adjective: more advanced."}, {"t": "b", "q": "I was very ___ (interest) in the lecture.", "a": ["interested"], "why": "The person feels: interested."}, {"t": "b", "q": "The film was very ___ (bore).", "a": ["boring"], "why": "The thing causes the feeling: boring."}, {"t": "b", "q": "I felt ___ (bore) during the film.", "a": ["bored"], "why": "The person feels: bored."}, {"t": "b", "q": "The ___ (company) profits rose this year.", "a": ["company's"], "why": "One company: add 's."}, {"t": "b", "q": "The ___ (students) doubts were answered.", "a": ["students'"], "why": "Plural ending in s: add only the apostrophe."}, {"t": "b", "q": "This is my ___ (sister) car.", "a": ["sister's"], "why": "One sister: add 's."}, {"t": "b", "q": "The ___ (children) toys are everywhere.", "a": ["children's"], "why": "Children does not end in s, so add 's."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Both humans and nature are affected.", "Humans and nature, both are affected."], "why": "Both goes before the two nouns."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We should not depend solely on one thing.", "We should not solely depend only on one thing."], "why": "Solely and only mean the same. Use one."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Only recently has AI become popular.", "Recently only AI has become popular."], "why": "\"Only recently\" goes first, and then has comes before the subject."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["She does not actually want it.", "She does actually not want it."], "why": "\"Not\" goes right after does."}]}, {"title": "Capitals, spacing and commas between subject and verb", "intro": "Choose the sentence that is written correctly.", "rules": ["No capital letter after a comma: <b>In conclusion, we<\/b>.", "Every sentence starts with a capital. Capitalise months, days, countries and languages.", "One space after a full stop or comma, and no space before them.", "No comma between a subject and its verb: <b>TV is a boon<\/b>."], "q": [{"t": "c", "q": "Choose the correct sentence.", "o": ["In conclusion, we need to act.", "In conclusion, We need to act."], "why": "No capital after a comma."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["In my opinion, it is a good idea.", "In my opinion, It is a good idea."], "why": "No capital after a comma."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The bus was late. However, we arrived on time.", "The bus was late. however, we arrived on time."], "why": "A new sentence starts with a capital."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The exam is in December.", "The exam is in december."], "why": "Months take a capital letter."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We met on Monday.", "We met on monday."], "why": "Days take a capital letter."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["I live in India.", "I live in india."], "why": "Countries take a capital letter."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["She speaks English.", "She speaks english."], "why": "     const row=document.createElement('div');row.className='row';
    const chk=document.createElement('button');chk.className='primary';chk.textContent='Check';
    const show=document.createElement('button');show.textContent='Show answer';
    row.appendChild(chk);row.appendChild(show);row.appendChild(again);el.appendChild(row);
    const finish=()=>{st.done=true;el.classList.add('fin');inp.disabled=true;chk.disabled=true;show.disabled=true;update();};
    const check=()=>{
      if(st.done)return;const v=norm(inp.value);if(!v){inp.focus();return}
      const ok=q.a.some(a=>norm(a)===v);
      if(st.first===null)st.first=ok;
      if(ok){el.className='q ok';fb.innerHTML='<span class="y">Correct!</span> '+q.why;finish();}
      else{el.className='q bad';fb.innerHTML='<span class="n">Not quite.</span> Change your answer and check again, or click Show answer.';inp.select();update();}
    };
    chk.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
    show.onclick=()=>{if(st.done)return;if(st.first===null)st.first=false;el.className='q bad';
      fb.innerHTML='<span class="n">Answer:</span> <span class="ans">'+q.a[0]+'</span>. '+q.why;finish();};
  } else {
    text.textContent=q.q;
    const opts=document.createElement('div');opts.className='opts'+(q.o.every(o=>o.length<16)?' inline':'');
    const list=q.fixed?q.order:shuffle(q.o);const btns=[];
    list.forEach(o=>{const b=document.createElement('button');b.textContent=o;btns.push(b);opts.appendChild(b);
      b.onclick=()=>{if(st.done)return;st.done=true;const ok=(o===q.o[0]);st.first=ok;
        btns.forEach(x=>{x.disabled=true;if(x.textContent===q.o[0])x.classList.add('right')});
        if(ok){el.className='q ok fin';fb.innerHTML='<span class="y">Correct!</span> '+q.why}
        else{b.classList.add('wrong');el.className='q bad fin';fb.innerHTML='<span class="n">Not quite.</span> The answer is <span class="ans">'+q.o[0]+'</span>. '+q.why}
        update();}});
    el.appendChild(opts);
    const row=document.createElement('div');row.className='row';row.appendChild(again);el.appendChild(row);
  }
  el.appendChild(fb);return el;
}
function render(qs,order){
  QS=qs;const box=document.getElementById('qs');box.innerHTML='';state=[];
  order.forEach((qi,n)=>box.appendChild(card(qs[qi],n)));update();
}
function update(){
  const total=state.length,done=state.filter(s=>s.done).length,right=state.filter(s=>s.done&&s.first===true).length;
  document.getElementById('score').textContent='Score: '+right+' / '+total;
  document.getElementById('bar').style.width=(100*done/total)+'%';
  const d=document.getElementById('done');
  if(done===total){d.style.display='block';const pct=Math.round(100*right/total);
    d.innerHTML='You got <b>'+right+' out of '+total+'</b> right on the first try ('+pct+'%).<br>'+(pct>=90?'Excellent work. Move on to the next topic.':pct>=70?'Good. Click Try again on the ones you missed, or Start again.':'Read the rules at the top again, then click Start again.');}
  else d.style.display='none';
}

const menu=document.getElementById('menu');
TOPICS.forEach((t,i)=>{const li=document.createElement('li');li.innerHTML='<a href="#'+(i+1)+'">'+(i+1)+'. '+t.title+' <span class="cnt">('+t.q.length+' questions)</span></a>';menu.appendChild(li)});
let cur=null;
function route(){
  const n=parseInt(location.hash.slice(1));
  if(!n||n<1||n>TOPICS.length){document.getElementById('home').style.display='';document.getElementById('topic').style.display='none';window.scrollTo(0,0);return}
  cur=TOPICS[n-1];document.getElementById('home').style.display='none';document.getElementById('topic').style.display='';
  document.getElementById('ttl').textContent=n+'. '+cur.title;
  document.getElementById('intro').textContent=cur.intro+(cur.q.some(x=>x.t==='b')?' Press Enter or tap Check to see if you are right.':' Tap an answer to see if you are right.');
  document.getElementById('rules').innerHTML=cur.rules.map(r=>'<li>'+r+'</li>').join('');
  const pv=document.getElementById('prev'),nx=document.getElementById('next');
  pv.style.visibility=n>1?'visible':'hidden';pv.href='#'+(n-1);
  nx.style.visibility=n<TOPICS.length?'visible':'hidden';nx.href='#'+(n+1);
  render(cur.q,cur.q.map((_,i)=>i));window.scrollTo(0,0);
}
document.getElementById('reset').onclick=()=>{render(cur.q,cur.q.map((_,i)=>i));window.scrollTo(0,0)};
document.getElementById('mix').onclick=()=>{render(cur.q,shuffle(cur.q.map((_,i)=>i)));window.scrollTo(0,0)};
window.addEventListener('hashchange',route);route();
</script></body></html>
