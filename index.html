<script>const TOPICS=[{"title": "Subject and verb agreement", "intro": "Choose the correct verb for each sentence.", "rules": ["Plural subjects take a verb with no -s: <b>they work<\/b>, <b>teachers work<\/b>, <b>all of us want<\/b>.", "He, she, it, or one person/thing takes the -s form: <b>she works<\/b>, <b>he does<\/b>, <b>it has<\/b>.", "After do, does, did, can, will, should and must, use the base verb: <b>does not affect<\/b>.", "Two subjects joined by <b>and<\/b> take a plural verb: <b>hard work and patience are<\/b>.", "Find the real subject. In \"one of my friends\", the subject is <b>one<\/b>. In \"robots as teachers\", it is <b>robots<\/b>."], "q": [{"t": "i", "q": "All of us ___ to pass the exam.", "o": ["want", "wants"], "why": "\"All of us\" is plural, so the verb has no -s."}, {"t": "i", "q": "Many of my friends ___ part-time jobs.", "o": ["have", "has"], "why": "\"Many of my friends\" is plural: have."}, {"t": "i", "q": "Teachers ___ very hard during exam season.", "o": ["work", "works"], "why": "\"Teachers\" is plural, so no -s on the verb."}, {"t": "i", "q": "My sister ___ at a hospital.", "o": ["works", "work"], "why": "\"My sister\" is one person (she), so the verb takes -s."}, {"t": "i", "q": "She ___ not like spicy food.", "o": ["does", "do"], "why": "With he, she or it, use does."}, {"t": "i", "q": "He does not ___ the answer.", "o": ["know", "knows"], "why": "After does, use the base verb with no -s."}, {"t": "i", "q": "Both my parents ___ doctors.", "o": ["are", "is"], "why": "\"Both my parents\" is plural: are."}, {"t": "i", "q": "Hard work and patience ___ to success.", "o": ["lead", "leads"], "why": "Two subjects joined by \"and\" take a plural verb."}, {"t": "i", "q": "Each student ___ a laptop.", "o": ["has", "have"], "why": "\"Each\" means one at a time, so it is singular: has."}, {"t": "i", "q": "The company ___ more staff.", "o": ["needs", "need"], "why": "\"The company\" is singular (it), so the verb takes -s."}, {"t": "i", "q": "Robots as teachers ___ a new idea.", "o": ["are", "is"], "why": "The subject is \"robots\", which is plural."}, {"t": "i", "q": "Students who practise every day ___ quickly.", "o": ["improve", "improves"], "why": "The subject is \"students\". \"Who practise every day\" only describes them."}, {"t": "i", "q": "One of my friends ___ in Toronto.", "o": ["lives", "live"], "why": "The subject is \"one\", which is singular."}, {"t": "i", "q": "Everybody ___ to be happy.", "o": ["wants", "want"], "why": "Everybody, everyone and somebody are singular."}, {"t": "i", "q": "People feel valued and ___ harder when managers listen.", "o": ["work", "works"], "why": "\"People\" is the subject of both verbs."}, {"t": "i", "q": "The leadership ___ the final decision.", "o": ["makes", "make"], "why": "\"The leadership\" is one group (it): makes."}, {"t": "i", "q": "Can she ___ a car?", "o": ["drive", "drives", "driving"], "why": "After can, use the base verb."}, {"t": "i", "q": "My brother and I ___ cricket every Sunday.", "o": ["play", "plays"], "why": "\"My brother and I\" means \"we\": play."}, {"t": "i", "q": "The list of tasks ___ very long.", "o": ["is", "are"], "why": "The subject is \"list\" (singular). \"Of tasks\" does not change it."}, {"t": "i", "q": "The number of students ___ growing every year.", "o": ["is", "are"], "why": "\"The number of\" is singular: is."}, {"t": "i", "q": "A number of students ___ absent today.", "o": ["are", "is"], "why": "\"A number of\" means \"many\", so it is plural: are."}, {"t": "i", "q": "The quality of these products ___ poor.", "o": ["is", "are"], "why": "The subject is \"quality\", not \"products\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Most of us have a phone.", "Most of us has a phone."], "why": "\"Most of us\" is plural: have."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Studies need a lot of focus.", "Studies needs a lot of focus."], "why": "\"Studies\" is plural, so the verb has no -s."}]}, {"title": "\"A\" or \"an\"", "intro": "Choose a, an, or no article.", "rules": ["Use <b>an<\/b> before a vowel <i>sound<\/i>: an example, an hour, an MBA.", "Use <b>a<\/b> before a consonant <i>sound<\/i>, even if the letter is a vowel: a university, a European, a one-way street.", "Never use a or an in front of a plural or uncountable noun: <b>arguments<\/b>, <b>advice<\/b>."], "q": [{"t": "i", "q": "It was ___ honest mistake.", "o": ["an", "a", "no article"], "why": "The h in honest is silent, so it starts with a vowel sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "She is ___ university student.", "o": ["a", "an", "no article"], "why": "University starts with a \"you\" sound, a consonant sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "He gave ___ example.", "o": ["an", "a", "no article"], "why": "Example starts with a vowel sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "We need ___ umbrella.", "o": ["an", "a", "no article"], "why": "Umbrella starts with a vowel sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "This is ___ one-way street.", "o": ["a", "an", "no article"], "why": "One starts with a \"w\" sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "She works as ___ engineer.", "o": ["an", "a", "no article"], "why": "Engineer starts with a vowel sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "He has ___ European passport.", "o": ["a", "an", "no article"], "why": "European starts with a \"you\" sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "It takes ___ hour to get there.", "o": ["an", "a", "no article"], "why": "The h in hour is silent.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "I bought ___ expensive watch.", "o": ["an", "a", "no article"], "why": "Expensive starts with a vowel sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "There was ___ argument at the meeting.", "o": ["an", "a", "no article"], "why": "Argument starts with a vowel sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "He made ___ important decision.", "o": ["an", "a", "no article"], "why": "Important starts with a vowel sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "She wants to become ___ teacher.", "o": ["a", "an", "no article"], "why": "Teacher starts with a consonant sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "Television is ___ integral part of life.", "o": ["an", "a", "no article"], "why": "Integral starts with a vowel sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "It was ___ useful lesson.", "o": ["a", "an", "no article"], "why": "Useful starts with a \"you\" sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "He is ___ MBA student.", "o": ["an", "a", "no article"], "why": "MBA is said \"em-bee-ay\", which starts with a vowel sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "We need to make ___ informed decision.", "o": ["an", "a", "no article"], "why": "Informed starts with a vowel sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "This policy caused ___ arguments in the team.", "o": ["no article", "a", "an"], "why": "Arguments is plural, so there is no a or an.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "She gave me ___ advice about the exam.", "o": ["no article", "a", "an"], "why": "Advice is uncountable, so there is no a or an.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "He wore ___ uniform to school.", "o": ["a", "an", "no article"], "why": "Uniform starts with a \"you\" sound.", "order": ["a", "an", "no article"]}, {"t": "i", "q": "It was ___ honour to meet her.", "o": ["an", "a", "no article"], "why": "The h in honour is silent.", "order": ["a", "an", "no article"]}]}, {"title": "Using \"the\"", "intro": "Choose the right article for each blank.", "rules": ["Use <b>the<\/b> with decades: <b>the 1950s<\/b>, <b>the early 2000s<\/b>.", "Use <b>the<\/b> in fixed phrases: the human race, the poverty line, the same, on the other hand, the other.", "A singular countable noun needs a, an or the: <b>a lot of<\/b>, <b>a shortage<\/b>, <b>an ideal situation<\/b>.", "Use no article for a general idea: <b>society<\/b>, <b>life<\/b>, <b>music<\/b> (in general)."], "q": [{"t": "i", "q": "Mobile phones became popular in ___ 1990s.", "o": ["the", "a", "an", "no article"], "why": "Decades take \"the\".", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "He was born in ___ early 2000s.", "o": ["the", "a", "an", "no article"], "why": "Periods like the early 2000s take \"the\".", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "On ___ other hand, malls are expensive.", "o": ["the", "a", "an", "no article"], "why": "The fixed phrase is \"on the other hand\".", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "Many families live below ___ poverty line.", "o": ["the", "a", "an", "no article"], "why": "There is only one poverty line.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "AI affects ___ human race.", "o": ["the", "a", "an", "no article"], "why": "\"The human race\" is a fixed phrase.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "___ society changes as technology improves.", "o": ["no article", "a", "an", "the"], "why": "Society in general takes no article.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "The two shops sell ___ same item.", "o": ["the", "a", "an", "no article"], "why": "\"Same\" always takes \"the\".", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "We had ___ lot of rain last week.", "o": ["a", "an", "the", "no article"], "why": "The phrase is \"a lot of\".", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "It is not ___ ideal situation.", "o": ["an", "a", "the", "no article"], "why": "Singular countable noun, and ideal starts with a vowel sound.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "She checks her email on ___ day-to-day basis.", "o": ["a", "an", "the", "no article"], "why": "The phrase is \"on a day-to-day basis\".", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "I love ___ music.", "o": ["no article", "a", "an", "the"], "why": "Music in general takes no article.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "___ music at the party was too loud.", "o": ["the", "a", "an", "no article"], "why": "Specific music (at the party): the.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "There is ___ shortage of water.", "o": ["a", "an", "the", "no article"], "why": "Shortage is singular and countable here.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "One shop is open, and ___ other is closed.", "o": ["the", "a", "an", "no article"], "why": "With two things, the second is \"the other\".", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "___ life is not always easy.", "o": ["no article", "a", "an", "the"], "why": "Life in general takes no article.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "___ sun rises in the east.", "o": ["the", "a", "an", "no article"], "why": "There is only one sun.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "He is ___ best student in the class.", "o": ["the", "a", "an", "no article"], "why": "Superlatives (best, biggest) take \"the\".", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "This is ___ problem we must solve.", "o": ["a", "an", "the", "no article"], "why": "A new, singular, countable problem.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "___ technology has changed how we work.", "o": ["no article", "a", "an", "the"], "why": "Technology in general takes no article.", "order": ["a", "an", "the", "no article"]}, {"t": "i", "q": "She plays ___ piano beautifully.", "o": ["the", "a", "an", "no article"], "why": "Musical instruments take \"the\".", "order": ["a", "an", "the", "no article"]}]}, {"title": "Singular and plural nouns", "intro": "Choose the correct form of the noun.", "rules": ["<b>One of the<\/b> is followed by a plural noun: one of the best <b>teachers<\/b>.", "<b>Many, multiple, several, different, various<\/b> are followed by plural nouns.", "Irregular plurals: life → lives, child → children, person → people, woman → women.", "Uncountable nouns have no plural and no a/an: research, advice, information, infrastructure, employment."], "q": [{"t": "i", "q": "She is one of the best ___ in the school.", "o": ["teachers", "teacher"], "why": "\"One of the\" is followed by a plural noun."}, {"t": "i", "q": "I have multiple ___ to finish today.", "o": ["tasks", "task"], "why": "\"Multiple\" means more than one."}, {"t": "i", "q": "There are different ___ of people in every city.", "o": ["classes", "class", "class's"], "why": "\"Different\" + plural noun. Words ending in -ss add -es."}, {"t": "i", "q": "Robots can do repetitive ___ without stopping.", "o": ["tasks", "task"], "why": "Tasks in general: use the plural."}, {"t": "i", "q": "Smartphones have changed our ___.", "o": ["lives", "lifes", "life"], "why": "The plural of life is lives."}, {"t": "i", "q": "Many ___ play outside after school.", "o": ["children", "childs", "childrens"], "why": "The plural of child is children."}, {"t": "i", "q": "Several ___ came up during the project.", "o": ["problems", "problem"], "why": "\"Several\" + plural noun."}, {"t": "i", "q": "Workers need regular ___.", "o": ["breaks", "break"], "why": "Breaks happen more than once: plural."}, {"t": "i", "q": "Three ___ attended the meeting.", "o": ["people", "peoples", "person"], "why": "The usual plural of person is people."}, {"t": "i", "q": "Two ___ won the award.", "o": ["women", "woman", "womans"], "why": "The plural of woman is women."}, {"t": "i", "q": "Mumbai is one of the largest ___ in India.", "o": ["cities", "city", "citys"], "why": "\"One of the\" + plural. City becomes cities."}, {"t": "i", "q": "Different ___ have different rules.", "o": ["countries", "country", "countrys"], "why": "Country becomes countries."}, {"t": "i", "q": "She gave me some good ___.", "o": ["advice", "advices"], "why": "Advice is uncountable, so it has no plural."}, {"t": "i", "q": "We need more ___ before we decide.", "o": ["information", "informations"], "why": "Information is uncountable."}, {"t": "i", "q": "Both of my ___ live abroad.", "o": ["brothers", "brother"], "why": "\"Both of my\" + plural noun."}, {"t": "i", "q": "The city needs better ___.", "o": ["infrastructure", "infrastructures"], "why": "Infrastructure is uncountable."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Research shows that sleep improves memory.", "A research shows that sleep improves memory.", "Researches show that sleep improves memory."], "why": "Research is uncountable. To count it, say \"a study\" or \"studies\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["This infrastructure uses a lot of water.", "These infrastructure uses a lot of water.", "These infrastructures uses a lot of water."], "why": "Infrastructure is uncountable, so use \"this\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["She found a job last month.", "She found an employment last month.", "She found employments last month."], "why": "Employment is uncountable. Use \"a job\" for one position."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["AI is one of the major technological advancements of our time.", "AI is one of the major technological advancement of our time."], "why": "\"One of the\" is always followed by a plural noun."}]}, {"title": "Commonly confused words", "intro": "Choose the right word for each blank.", "rules": ["<b>than<\/b> compares; <b>then<\/b> means next or at that time.", "<b>their<\/b> = belonging to them; <b>there<\/b> = a place or \"there is\"; <b>they're<\/b> = they are.", "<b>its<\/b> = belonging to it; <b>it's<\/b> = it is or it has.", "<b>sometimes<\/b> = now and then; <b>sometime<\/b> = at some unknown time.", "Spelling check: <b>because<\/b>, <b>in any way<\/b>, <b>bane<\/b>."], "q": [{"t": "i", "q": "She is taller ___ her brother.", "o": ["than", "then"], "why": "Comparison: than."}, {"t": "i", "q": "We ate dinner, and ___ we watched a film.", "o": ["then", "than"], "why": "Next in time: then."}, {"t": "i", "q": "I would rather walk ___ drive.", "o": ["than", "then"], "why": "Comparison between two choices: than."}, {"t": "i", "q": "First mix the flour, ___ add the eggs.", "o": ["then", "than"], "why": "Next step: then."}, {"t": "i", "q": "Experience matters more ___ degrees.", "o": ["than", "then"], "why": "\"More\" signals a comparison: than."}, {"t": "i", "q": "___ house is near the station.", "o": ["Their", "There", "They're"], "why": "Belonging to them: their."}, {"t": "i", "q": "Put the books over ___.", "o": ["there", "their", "they're"], "why": "A place: there."}, {"t": "i", "q": "___ going to be late.", "o": ["They're", "Their", "There"], "why": "They are going: they're."}, {"t": "i", "q": "___ is a problem with the code.", "o": ["There", "Their", "They're"], "why": "\"There is\": there."}, {"t": "i", "q": "The company changed ___ logo.", "o": ["its", "it's", "its'"], "why": "Belonging to the company: its."}, {"t": "i", "q": "___ raining again.", "o": ["It's", "Its", "Its'"], "why": "It is raining: it's."}, {"t": "i", "q": "The dog wagged ___ tail.", "o": ["its", "it's"], "why": "Belonging to the dog: its."}, {"t": "i", "q": "___ been a long day.", "o": ["It's", "Its"], "why": "It has been: it's."}, {"t": "i", "q": "I ___ walk to work when the weather is nice.", "o": ["sometimes", "sometime"], "why": "Now and then: sometimes."}, {"t": "i", "q": "Let's meet ___ next week.", "o": ["sometime", "sometimes"], "why": "At an unknown time: sometime."}, {"t": "i", "q": "___ the trains are late.", "o": ["Sometimes", "Sometime"], "why": "Now and then: sometimes."}, {"t": "i", "q": "This change will not help us in ___ way.", "o": ["any", "anyway"], "why": "\"In any way\" is three separate words."}, {"t": "i", "q": "Social media can be both a boon and a ___.", "o": ["bane", "bain", "bayne"], "why": "The word is spelled bane."}, {"t": "i", "q": "I was late ___ the bus broke down.", "o": ["because", "becuase", "beacause"], "why": "The spelling is b-e-c-a-u-s-e."}]}, {"title": "Run-on sentences (comma splices)", "intro": "Choose the sentence that is punctuated correctly.", "rules": ["A comma alone cannot join two complete sentences.", "Fix it with a full stop, a semicolon, or a joining word (and, but, so).", "<b>However<\/b>, <b>on the other hand<\/b> and <b>because of this<\/b> cannot join two sentences with just a comma. Start a new sentence or use a semicolon."], "q": [{"t": "c", "q": "Choose the correct sentence.", "o": ["The train was late. I missed my meeting.", "The train was late, I missed my meeting."], "why": "Two complete sentences need a full stop between them."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["I like tea, but my brother likes coffee.", "I like tea, my brother likes coffee."], "why": "Add a joining word (but) after the comma."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The job pays well; however, the hours are long.", "The job pays well, however the hours are long.", "The job pays well, however, the hours are long."], "why": "\"However\" needs a semicolon or full stop before it and a comma after it."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["She studied hard, so she passed.", "She studied hard, she passed."], "why": "\"So\" joins the two sentences."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["TV is popular; most homes have one.", "TV is popular, most homes have one."], "why": "A semicolon can join two closely related sentences."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["It rained all day. Because of this, the match was cancelled.", "It rained all day, because of this the match was cancelled."], "why": "\"Because of this\" starts a new sentence."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Malls are expensive. On the other hand, they offer variety.", "Malls are expensive, on the other hand, they offer variety."], "why": "\"On the other hand\" starts a new sentence here."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["He was tired, so he went to bed early.", "He was tired, he went to bed early."], "why": "Join with \"so\" or use a full stop."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The policy helped staff. They felt more responsible.", "The policy helped staff, they felt more responsible."], "why": "Two complete sentences: use a full stop."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["I wanted to go out, but it was raining.", "I wanted to go out, it was raining."], "why": "Use \"but\" to show the contrast."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Prices are rising, and people are buying less.", "Prices are rising, people are buying less."], "why": "Use \"and\" after the comma, or a full stop."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["AI is useful. However, it uses a lot of water.", "AI is useful, however it uses a lot of water.", "AI is useful, however, it uses a lot of water."], "why": "Start a new sentence with \"However,\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Robots do not get tired; they can work all day.", "Robots do not get tired, they can work all day."], "why": "Use a semicolon or full stop between two complete sentences."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["My phone died, so I could not call you.", "My phone died, I could not call you."], "why": "Use \"so\" to join cause and result."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Many people use AI. As a result, they think less for themselves.", "Many people use AI, as a result, they think less for themselves.", "Many people use AI, as a result they think less for themselves."], "why": "\"As a result\" starts a new sentence."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Everyone has a right to an opinion. This applies to employees too.", "Everyone has a right to an opinion, this applies to employees too."], "why": "Two complete sentences: use a full stop."}]}, {"title": "Verb tense", "intro": "Choose the correct verb form.", "rules": ["Finished past events use the simple past: <b>opened<\/b>, <b>got<\/b>, <b>developed<\/b>.", "<b>Since<\/b> or <b>for<\/b> up to now uses has/have + past participle: <b>has lived since 2019<\/b>.", "In an <b>if<\/b> or <b>unless<\/b> clause about the future, use the present tense, not will: <b>if it rains<\/b>.", "After will, would and can, use the base verb: <b>there will be<\/b>."], "q": [{"t": "i", "q": "Last year, the company ___ a new office.", "o": ["opened", "has opened", "opens"], "why": "Last year is finished time: simple past."}, {"t": "i", "q": "Yesterday, I ___ my exam results.", "o": ["got", "get", "have got"], "why": "Yesterday is finished time: got."}, {"t": "i", "q": "She ___ in Toronto since 2019.", "o": ["has lived", "lived", "lives"], "why": "\"Since 2019\" takes has/have + past participle."}, {"t": "i", "q": "AI ___ since the 1950s.", "o": ["has existed", "existed", "exists"], "why": "\"Since\" + a point in time: has existed."}, {"t": "i", "q": "If it ___ tomorrow, we will stay home.", "o": ["rains", "will rain", "rained"], "why": "No \"will\" in the if-clause."}, {"t": "i", "q": "If you ___, you will fail.", "o": ["do not study", "will not study", "did not study"], "why": "Present tense in the if-clause."}, {"t": "i", "q": "Experts say there will ___ a shortage of water.", "o": ["be", "is", "being"], "why": "After will, use the base verb."}, {"t": "i", "q": "Last week, the news said there ___ a shortage of oil.", "o": ["would be", "will be", "is will"], "why": "In reported past speech, will becomes would."}, {"t": "i", "q": "Every year, when children ___ school, they learn to share.", "o": ["start", "starting", "will start"], "why": "A general truth: present simple."}, {"t": "i", "q": "In 2010, few people ___ smartphones.", "o": ["used", "have used", "use"], "why": "2010 is finished time: simple past."}, {"t": "i", "q": "The flaw ___ in the code since 2002 before anyone found it.", "o": ["had been", "has been", "was being"], "why": "Before another past event: had been."}, {"t": "i", "q": "I ___ him for ten years, and we are still friends.", "o": ["have known", "know", "knew"], "why": "For a length of time up to now: have known."}, {"t": "i", "q": "Two days ago, she ___ a new job.", "o": ["found", "has found", "finds"], "why": "Two days ago is finished time: found."}, {"t": "i", "q": "Previously, only managers ___ to decide.", "o": ["got", "get", "gets"], "why": "\"Previously\" shows finished past time."}, {"t": "i", "q": "We ___ friends since childhood.", "o": ["have been", "are", "were"], "why": "\"Since childhood\" takes have been."}, {"t": "i", "q": "Unless you ___, you will not improve.", "o": ["practise", "will practise", "practised"], "why": "Present tense after unless."}, {"t": "i", "q": "If he ___, tell him I am out.", "o": ["calls", "will call", "call"], "why": "Present tense in the if-clause, with -s for he."}, {"t": "i", "q": "In December, AI ___ a way to find security flaws.", "o": ["developed", "has developed", "develops"], "why": "\"In December\" is finished time: developed."}]}, {"title": "Pronoun agreement", "intro": "Choose the correct pronoun.", "rules": ["Plural nouns take <b>they / them / their<\/b>, not it / its.", "Singular things, companies and groups take <b>it / its<\/b>.", "For one person whose gender is unknown, use <b>he or she<\/b> (subject), <b>him or her<\/b> (object), <b>his or her<\/b> (possessive).", "Make the subject match: <b>As students, we<\/b>, not As a student, we."], "q": [{"t": "i", "q": "Smartphones are useful, but ___ screens break easily.", "o": ["their", "its", "there"], "why": "Smartphones is plural: their."}, {"t": "i", "q": "The company changed ___ policy last month.", "o": ["its", "their", "it's"], "why": "One company: its."}, {"t": "i", "q": "Robots as teachers have ___ benefits.", "o": ["their", "its"], "why": "Robots is plural: their."}, {"t": "i", "q": "If a student is late, ___ must sign in at the office.", "o": ["he or she", "him or her", "his or her"], "why": "Subject of the verb: he or she."}, {"t": "i", "q": "Each employee must bring ___ own laptop.", "o": ["his or her", "he or she", "him or her"], "why": "Possessive: his or her."}, {"t": "i", "q": "Every child needs someone to love ___.", "o": ["him or her", "he or she", "his or her"], "why": "Object of the verb love: him or her."}, {"t": "i", "q": "My parents love ___ garden.", "o": ["their", "his", "its"], "why": "Parents is plural: their."}, {"t": "i", "q": "The children finished ___ homework.", "o": ["their", "his", "its"], "why": "Children is plural: their."}, {"t": "i", "q": "The government announced ___ new budget.", "o": ["its", "it's", "his"], "why": "One government: its."}, {"t": "i", "q": "Nature is losing ___ balance.", "o": ["its", "their", "it's"], "why": "Nature is singular: its."}, {"t": "i", "q": "When people feel valued, ___ work harder.", "o": ["they", "he", "it"], "why": "People is plural: they."}, {"t": "i", "q": "Teachers use different methods to help ___ students.", "o": ["their", "its", "his"], "why": "Teachers is plural: their."}, {"t": "i", "q": "My sister and I visited ___ grandmother.", "o": ["our", "my", "their"], "why": "My sister and I = we, so our."}, {"t": "i", "q": "A poor person is happy if ___ can feed the family.", "o": ["he or she", "him or her", "his or her"], "why": "Subject of can feed: he or she."}, {"t": "i", "q": "I gave the students ___ results.", "o": ["their", "there", "they're"], "why": "Belonging to the students: their."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["As students, we had very little money.", "As a student, we had very little money."], "why": "\"We\" is plural, so the opening must be plural too."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Despite their benefits, robots can cause problems.", "Despite its benefits, robots can cause problems."], "why": "Robots is plural: their."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We must balance robots and teachers to maximize their benefits.", "We must balance robots and teachers to maximize its benefits."], "why": "Robots and teachers are plural: their."}]}, {"title": "Prepositions and fixed phrases", "intro": "Choose the correct preposition.", "rules": ["opinion <b>on<\/b>, close <b>to<\/b>, apply something <b>to<\/b>, need <b>for<\/b>, empathy <b>for<\/b>, decision <b>about<\/b>, get out <b>of<\/b>.", "<b>at<\/b> night, <b>during<\/b> the day, <b>in<\/b> this way, <b>in<\/b> fact.", "<b>In<\/b> my opinion, <b>from<\/b> my point of view.", "Some verbs take no preposition: <b>rethink<\/b> the plan, <b>discuss<\/b> the issue."], "q": [{"t": "i", "q": "Everyone has an opinion ___ the new law.", "o": ["on", "onto", "at"], "why": "Opinion on something."}, {"t": "i", "q": "Children feel close ___ their parents.", "o": ["to", "with", "by"], "why": "Close to someone."}, {"t": "i", "q": "You can apply this rule ___ other situations.", "o": ["to", "into", "on"], "why": "Apply something to something."}, {"t": "i", "q": "There is a need ___ more teachers.", "o": ["for", "of", "to"], "why": "A need for something."}, {"t": "i", "q": "Good teachers show empathy ___ weak students.", "o": ["for", "with", "to"], "why": "Empathy for someone."}, {"t": "i", "q": "We made a decision ___ the budget.", "o": ["about", "of", "for"], "why": "A decision about something."}, {"t": "i", "q": "We need to get out ___ this habit.", "o": ["of", "from", "by"], "why": "Get out of something."}, {"t": "i", "q": "She works ___ night.", "o": ["at", "in", "on"], "why": "At night."}, {"t": "i", "q": "He studies ___ the day.", "o": ["during", "at", "on"], "why": "During the day."}, {"t": "i", "q": "___ this way, everyone benefits.", "o": ["In", "By", "On"], "why": "In this way (not by this way)."}, {"t": "i", "q": "___ my opinion, school should start later.", "o": ["In", "According to", "On"], "why": "In my opinion (not according to me)."}, {"t": "i", "q": "___ my point of view, TV is useful.", "o": ["From", "In", "On"], "why": "From my point of view."}, {"t": "i", "q": "___ fact, the plan saved money.", "o": ["In", "For", "By"], "why": "In fact."}, {"t": "i", "q": "She is good ___ maths.", "o": ["at", "in", "on"], "why": "Good at something."}, {"t": "i", "q": "He depends ___ his parents.", "o": ["on", "of", "from"], "why": "Depend on someone."}, {"t": "i", "q": "I am interested ___ supply chains.", "o": ["in", "on", "about"], "why": "Interested in something."}, {"t": "i", "q": "This idea is different ___ that one.", "o": ["from", "with", "of"], "why": "Different from."}, {"t": "i", "q": "She is responsible ___ the project.", "o": ["for", "of", "about"], "why": "Responsible for something."}, {"t": "i", "q": "Thank you ___ your help.", "o": ["for", "of", "about"], "why": "Thank someone for something."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We need to rethink our plan.", "We need to rethink on our plan."], "why": "Rethink takes no preposition."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We will discuss the problem.", "We will discuss about the problem."], "why": "Discuss takes no preposition."}]}, {"title": "Word order, word form and possessives", "intro": "Choose the correct word or sentence.", "rules": ["<b>not<\/b> comes right after the first helping verb: <b>will not be<\/b>.", "Frequency words (sometimes, usually, often) go before the main verb.", "-ed words describe how a person feels (<b>bored<\/b>); -ing words describe the thing that causes it (<b>boring<\/b>).", "Possession: the company<b>'s<\/b> profits (one), the students<b>'<\/b> doubts (plural ending in s), the children<b>'s<\/b> toys.", "<b>Both<\/b> goes before the two nouns it joins. Do not repeat the same idea (solely ... only)."], "q": [{"t": "c", "q": "Choose the correct sentence.", "o": ["He will not be happy.", "He will be not happy."], "why": "\"Not\" goes right after will."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We sometimes have to do two jobs.", "We have sometimes do two jobs.", "We have sometimes to do two jobs."], "why": "Sometimes goes before \"have to\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["People usually watch TV after dinner.", "People watch usually TV after dinner.", "People usually are watch TV after dinner."], "why": "Usually goes before the main verb."}, {"t": "i", "q": "The story kept the children ___.", "o": ["entertained", "entertain", "entertaining"], "why": "Keep someone + past participle: entertained."}, {"t": "i", "q": "Technology is getting more ___.", "o": ["advanced", "advance", "advancing"], "why": "Get + adjective: more advanced."}, {"t": "i", "q": "I was very ___ in the lecture.", "o": ["interested", "interesting", "interest"], "why": "The person feels: interested."}, {"t": "i", "q": "The film was very ___.", "o": ["boring", "bored", "bore"], "why": "The thing causes the feeling: boring."}, {"t": "i", "q": "I felt ___ during the film.", "o": ["bored", "boring", "bore"], "why": "The person feels: bored."}, {"t": "i", "q": "The ___ profits rose this year.", "o": ["company's", "companies", "companys"], "why": "One company: add 's."}, {"t": "i", "q": "All the ___ doubts were answered.", "o": ["students'", "student's", "students"], "why": "Plural ending in s: add only the apostrophe."}, {"t": "i", "q": "This is my ___ car. She bought it last year.", "o": ["sister's", "sisters", "sister"], "why": "One sister: add 's."}, {"t": "i", "q": "The ___ toys are everywhere.", "o": ["children's", "childrens'", "childrens"], "why": "Children does not end in s, so add 's."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Both humans and nature are affected.", "Humans and nature, both are affected."], "why": "Both goes before the two nouns."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We should not depend solely on one thing.", "We should not solely depend only on one thing."], "why": "Solely and only mean the same. Use one."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Only recently has AI become popular.", "Recently only AI has become popular.", "Only recently AI has become popular."], "why": "\"Only recently\" goes first, and then has comes before the subject."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["She does not actually want it.", "She does actually not want it."], "why": "\"Not\" goes right after does."}]}, {"title": "Capitals, spacing and commas between subject and verb", "intro": "Choose the sentence that is written correctly.", "rules": ["No capital letter after a comma: <b>In conclusion, we<\/b>.", "Every sentence starts with a capital. Capitalise months, days, countries and languages.", "One space after a full stop or comma, and no space before them.", "No comma between a subject and its verb: <b>TV is a boon<\/b>."], "q": [{"t": "c", "q": "Choose the correct sentence.", "o": ["In conclusion, we need to act.", "In conclusion, We need to act."], "why": "No capital after a comma."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["In my opinion, it is a good idea.", "In my opinion, It is a good idea."], "why": "No capital after a comma."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The bus was late. However, we arrived on time.", "The bus was late. however, we arrived on time."], "why": "A new sentence starts with a capital."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The exam is in December.", "The exam is in december."], "why": "Months take a capital letter."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We met on Monday.", "We met on monday."], "why": "Days take a capital letter."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["I live in India.", "I live in india."], "why": "Countries take a capital letter."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["She speaks English.", "She speaks english."], "why": "Languages take a capital letter."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["I finished early. Then I went home.", "I finished early.Then I went home.", "I finished early .Then I went home."], "why": "One space after a full stop, none before it."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["From childhood, we learn to share.", "From childhood , we learn to share."], "why": "No space before a comma."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We know what to do in this particular scenario.", "We know what to do in this particularscenario."], "why": "Leave a space between words."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["TV is a boon to humankind.", "TV, is a boon to humankind."], "why": "No comma between the subject (TV) and the verb (is)."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The people who did the work felt ignored.", "The people who did the work, felt ignored."], "why": "No comma between the subject and the verb."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Oil passes through the Strait of Hormuz.", "Oil passes through the strait of hormuz."], "why": "Names of places take capital letters."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Many of us, around the world, have heard this.", "Many of us around, have heard this."], "why": "No single comma between the subject and the verb."}]}, {"title": "Commas, colons and other punctuation", "intro": "Choose the sentence with the correct punctuation.", "rules": ["Use a <b>colon<\/b> before an example or explanation: <b>Consider this example: if you ...<\/b>", "Put a comma after an opening phrase: <b>In this essay,<\/b> <b>Today,<\/b> <b>For example,<\/b>", "Put commas on both sides of interrupters: <b>TV, on the other hand, is<\/b> ...", "Comma before <b>which<\/b> when it adds extra information. No comma before <b>because<\/b> or <b>so that<\/b> at the end.", "Comma before <b>but / and / so<\/b> when they join two full sentences, and before <b>etc.<\/b> in a list."], "q": [{"t": "c", "q": "Choose the correct sentence.", "o": ["Consider this example: if you do not teach a child, he will not learn.", "Consider this as an example if you do not teach a child, he will not learn.", "Consider this example, if you do not teach a child, he will not learn."], "why": "Use a colon to introduce the example."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Remember one rule: always check your verbs.", "Remember one rule always check your verbs.", "Remember one rule; always check your verbs."], "why": "A colon introduces the rule."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["He has two goals: pass the exam and find a job.", "He has two goals, pass the exam and find a job."], "why": "A colon introduces the list of goals."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["In this essay, we will discuss AI.", "In this essay we, will discuss AI."], "why": "Comma after the opening phrase."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Today, technology is everywhere.", "Today technology, is everywhere."], "why": "Comma after the opening word."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["For example, in December the system failed.", "For example. in December the system failed.", "For example in December, the system failed."], "why": "\"For example\" is followed by a comma."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["After coming home from work, people relax.", "After coming home from work people, relax."], "why": "The comma goes after the whole opening phrase."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Because of this, humans depend on AI.", "Because of this humans, depend on AI."], "why": "The comma goes after \"Because of this\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The plan, in fact, saved money.", "The plan in fact, saved money.", "The plan, in fact saved money."], "why": "Interrupters need a comma on both sides."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["TV, on the other hand, is fun.", "TV, on the other hand is fun.", "TV on the other hand, is fun."], "why": "Interrupters need a comma on both sides."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["I visited Paris, which is beautiful.", "I visited Paris which is beautiful."], "why": "Comma before \"which\" when it adds extra information."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["I stayed home because it rained.", "I stayed home, because it rained."], "why": "No comma before \"because\" when the reason comes at the end."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["She saved money so that she could travel.", "She saved money, so that she could travel."], "why": "No comma before \"so that\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["The test was hard, but everyone passed.", "The test was hard but, everyone passed."], "why": "The comma goes before \"but\"."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["We bought apples, bananas, oranges, etc.", "We bought apples, bananas, oranges etc."], "why": "Put a comma before \"etc.\" in a list."}, {"t": "c", "q": "Choose the correct sentence.", "o": ["Without TV, people would be less informed.", "Without TV people, would be less informed."], "why": "Comma after the opening phrase \"Without TV\"."}]}, {"title": "Spelling words to memorise", "intro": "Choose the correct spelling.", "rules": ["These are the words you misspelled in your essays.", "Look closely: the wrong choices are very close to the right ones."], "q": [{"t": "i", "q": "I was late ___ the bus was full.", "o": ["because", "becuase", "becouse"], "why": "b-e-c-a-u-s-e"}, {"t": "i", "q": "They lost ___ keys.", "o": ["their", "thier", "thir"], "why": "t-h-e-i-r"}, {"t": "i", "q": "___ intelligence is changing work.", "o": ["Artificial", "Artifical", "Artificail"], "why": "A-r-t-i-f-i-c-i-a-l"}, {"t": "i", "q": "We solved the ___.", "o": ["problem", "promblem", "problam"], "why": "p-r-o-b-l-e-m"}, {"t": "i", "q": "We must protect the ___.", "o": ["environment", "enviroment", "enviornment"], "why": "e-n-v-i-r-o-n-m-e-n-t"}, {"t": "i", "q": "The shop sells many ___.", "o": ["products", "poducts", "prodcuts"], "why": "p-r-o-d-u-c-t-s"}, {"t": "i", "q": "___, the plan failed.", "o": ["However", "Howerver", "Howver"], "why": "H-o-w-e-v-e-r"}, {"t": "i", "q": "She could not ___ the task.", "o": ["perform", "perforrm", "preform"], "why": "p-e-r-f-o-r-m"}, {"t": "i", "q": "It was not ___ to happen.", "o": ["meant", "ment", "meanted"], "why": "m-e-a-n-t"}, {"t": "i", "q": "The city needs new ___.", "o": ["infrastructure", "infrastructre", "infrastucture"], "why": "i-n-f-r-a-s-t-r-u-c-t-u-r-e"}, {"t": "i", "q": "A lot of water is ___.", "o": ["consumed", "consumend", "consummed"], "why": "c-o-n-s-u-m-e-d"}, {"t": "i", "q": "Climate change threatens our ___.", "o": ["existence", "existance", "existense"], "why": "e-x-i-s-t-e-n-c-e"}, {"t": "i", "q": "The test was ___.", "o": ["difficult", "dificult", "difficalt"], "why": "d-i-f-f-i-c-u-l-t (double f, one l)"}, {"t": "i", "q": "Some tasks ___ more time.", "o": ["require", "requre", "requier"], "why": "r-e-q-u-i-r-e"}, {"t": "i", "q": "He is doing well ___.", "o": ["financially", "financialy", "finacially"], "why": "f-i-n-a-n-c-i-a-l-l-y (double l)"}, {"t": "i", "q": "Big ___ have many malls.", "o": ["cities", "citites", "citys"], "why": "c-i-t-i-e-s"}, {"t": "i", "q": "Exercise helps you ___ good health.", "o": ["maintain", "mantain", "maintane"], "why": "m-a-i-n-t-a-i-n"}, {"t": "i", "q": "TV has two main ___.", "o": ["categories", "chategories", "catagories"], "why": "c-a-t-e-g-o-r-i-e-s"}, {"t": "i", "q": "TV helps ___ information.", "o": ["disseminate", "desimate", "disseminete"], "why": "d-i-s-s-e-m-i-n-a-t-e (double s)"}, {"t": "i", "q": "TV is a source of ___.", "o": ["entertainment", "enetertainment", "entertainmant"], "why": "e-n-t-e-r-t-a-i-n-m-e-n-t"}, {"t": "i", "q": "Success needs ___.", "o": ["hard work", "hardwork", "hard-work"], "why": "Two words: hard work."}, {"t": "i", "q": "___ are busier than others.", "o": ["Some days", "Somedays", "Someday"], "why": "Two words: some days."}, {"t": "i", "q": "TV is a boon to ___.", "o": ["humankind", "human kind", "humenkind"], "why": "One word: humankind."}, {"t": "i", "q": "___ I study late at night.", "o": ["Sometimes", "Somtime", "Sometime"], "why": "Now and then: sometimes."}]}];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let state=[];
function card(q,n){
  const st={done:false,first:null,sel:null};state[n]=st;
  const el=document.createElement('div');el.className='q';
  const num=document.createElement('div');num.className='num';num.textContent='Question '+(n+1);el.appendChild(num);
  const text=document.createElement('div');text.className='text';el.appendChild(text);
  const list=q.order?q.order:shuffle(q.o);const btns=[];
  const mk=o=>{const b=document.createElement('button');b.type='button';b.textContent=o;b.className='opt';btns.push(b);
    b.onclick=()=>{if(st.done)return;btns.forEach(x=>x.classList.remove('sel','wrong'));b.classList.add('sel');st.sel=o;
      el.className='q';fb.innerHTML='';};return b;};
  if(q.t==='i'){
    const parts=q.q.split('___');text.appendChild(document.createTextNode(parts[0]));
    const pills=document.createElement('span');pills.className='pills';
    list.forEach((o,k)=>{if(k)pills.appendChild(Object.assign(document.createElement('span'),{className:'slash',textContent:'/'}));pills.appendChild(mk(o));});
    text.appendChild(pills);text.appendChild(document.createTextNode(parts[1]||''));
  } else {
    text.textContent=q.q;const opts=document.createElement('div');opts.className='opts';
    list.forEach(o=>opts.appendChild(mk(o)));el.appendChild(opts);
  }
  const row=document.createElement('div');row.className='row';
  const chk=document.createElement('button');chk.className='primary';chk.textContent='Check';
  const show=document.createElement('button');show.textContent='Show answer';
  const again=document.createElement('button');again.textContent='Try again';again.className='again';
  row.appendChild(chk);row.appendChild(show);row.appendChild(again);el.appendChild(row);
  const fb=document.createElement('div');fb.className='fb';el.appendChild(fb);
  const finish=()=>{st.done=true;chk.disabled=true;show.disabled=true;btns.forEach(x=>x.disabled=true);el.classList.add('fin');update();};
  chk.onclick=()=>{
    if(st.done)return;
    if(st.sel===null){fb.innerHTML='<span class="n">Choose an answer first.</span>';return}
    const ok=st.sel===q.o[0];if(st.first===null)st.first=ok;
    const b=btns.find(x=>x.textContent===st.sel);
    if(ok){b.classList.remove('sel');b.classList.add('right');el.className='q ok';fb.innerHTML='<span class="y">Correct!</span> '+q.why;finish();}
    else{b.classList.remove('sel');b.classList.add('wrong');el.className='q bad';st.sel=null;
      fb.innerHTML='<span class="n">Not quite.</span> Choose another answer and check again, or tap Show answer.';update();}
  };
  show.onclick=()=>{if(st.done)return;if(st.first===null)st.first=false;
    btns.forEach(x=>{x.classList.remove('sel');if(x.textContent===q.o[0])x.classList.add('right')});
    el.className='q bad';fb.innerHTML='<span class="n">Answer:</span> <span class="ans">'+q.o[0]+'</span>. '+q.why;finish();};
  again.onclick=()=>{const fresh=card(q,n);el.replaceWith(fresh);update();};
  return el;
}
function render(qs,order){
  const box=document.getElementById('qs');box.innerHTML='';state=[];
  order.forEach((qi,n)=>box.appendChild(card(qs[qi],n)));update();
}
function update(){
  const total=state.length,done=state.filter(s=>s.done).length,right=state.filter(s=>s.done&&s.first===true).length;
  document.getElementById('score').textContent='Score: '+right+' / '+total;
  document.getElementById('bar').style.width=(100*done/total)+'%';
  const d=document.getElementById('done');
  if(done===total){d.style.display='block';const pct=Math.round(100*right/total);
    d.innerHTML='You got <b>'+right+' out of '+total+'</b> right on the first try ('+pct+'%).<br>'+(pct>=90?'Excellent work. Move on to the next topic.':pct>=70?'Good. Tap Try again on the ones you missed, or Start again.':'Read the rules at the top again, then tap Start again.');}
  else d.style.display='none';
}

const menu=document.getElementById('menu');
TOPICS.forEach((t,i)=>{const li=document.createElement('li');li.innerHTML='<a href="#'+(i+1)+'">'+(i+1)+'. '+t.title+' <span class="cnt">('+t.q.length+' questions)</span></a>';menu.appendChild(li)});
let cur=null;
function route(){
  const n=parseInt(location.hash.slice(1));
  if(!n||n<1||n>TOPICS.length){document.getElementById('home').style.display='';document.getElementById('topic').style.display='none';window.scrollTo(0,0);return}
  cur=TOPICS[n-1];document.getElementById('home').style.display='none';document.getElementById('topic').style.display='';
  document.getElementById('ttl').textContent=n+'. '+cur.title;
  document.getElementById('intro').textContent=cur.intro+' Pick an answer, then tap Check.';
  document.getElementById('rules').innerHTML=cur.rules.map(r=>'<li>'+r+'</li>').join('');
  const pv=document.getElementById('prev'),nx=document.getElementById('next');
  pv.style.visibility=n>1?'visible':'hidden';pv.href='#'+(n-1);
  nx.style.visibility=n<TOPICS.length?'visible':'hidden';nx.href='#'+(n+1);
  render(cur.q,cur.q.map((_,i)=>i));window.scrollTo(0,0);
}
document.getElementById('reset').onclick=()=>{render(cur.q,cur.q.map((_,i)=>i));window.scrollTo(0,0)};
document.getElementById('mix').onclick=()=>{render(cur.q,shuffle(cur.q.map((_,i)=>i)));window.scrollTo(0,0)};
window.addEventListener('hashchange',route);route();
</script></body></html>
